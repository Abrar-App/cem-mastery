<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0c3558">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CEM Mastery">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>CEM Mastery</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">CEM</div>
      <div><strong>CEM Mastery</strong><small>Private Tutor</small></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
      <button class="icon-btn" id="backupBtn" title="Backup">⇩</button>
      <label class="icon-btn upload-btn" title="Restore">⇧<input type="file" id="restoreInput" accept=".json,application/json"></label>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Primary">
    <button data-view="home" class="nav-btn active"><span>⌂</span><b>Home</b></button>
    <button data-view="course" class="nav-btn"><span>▤</span><b>Course</b></button>
    <button data-view="practice" class="nav-btn"><span>✎</span><b>Practice</b></button>
    <button data-view="flashcards" class="nav-btn"><span>▭</span><b>Cards</b></button>
    <button data-view="mocks" class="nav-btn"><span>◷</span><b>Mocks</b></button>
    <button data-view="progress" class="nav-btn"><span>◉</span><b>Progress</b></button>
  </nav>
</div>

<div id="toast" class="toast" role="status"></div>
<script src="./app.js"></script>
</body>
</html>
